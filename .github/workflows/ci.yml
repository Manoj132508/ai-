name: CI

# Runs the three test suites on every push and every PR into main. Each service
# is an independent job so a client failure does not hide a server pass, and the
# three run in parallel.
on:
  push:
  pull_request:
    branches: [main]

jobs:
  server:
    name: server (node:test)
    runs-on: ubuntu-latest
    # The auth and upload suites are integration tests against a real Mongo, so
    # CI provides one as a service container. The tests default to
    # mongodb://127.0.0.1:27017 and use a separate *_test database.
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
        working-directory: server
      - run: npm test
        working-directory: server

  client:
    name: client (vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
        working-directory: client
      - run: npm test
        working-directory: client

  ai-service:
    name: ai-service (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements-dev.txt
      - run: pip install -r ai-service/requirements-dev.txt
      # pytest config (testpaths, pythonpath, asyncio_mode) lives in the root
      # pyproject.toml, so it runs from the repo root. The suite is fully
      # offline; the model-loading and live-API tests skip themselves.
      - run: python -m pytest
      - run: ruff check ai-service
