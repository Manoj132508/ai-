# nginx site for the SPA container.
#
# Two responsibilities: serve the built React app with correct SPA routing and
# cache headers, and proxy /api to the Express service so the browser talks to
# ONE origin (which is what makes the httpOnly auth cookie work without CORS).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text responses on the way out. This is the "compression belongs
    # at the edge" decision from Phase 13 -- done here, at the static front
    # door, NOT in the Node app, and NOT for the streamed /api responses below.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed build assets are immutable: the filename changes when the content
    # does (Vite content-hashing), so they can be cached hard and forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must NOT be cached: it is the tiny file that points at the
    # current hashed bundles. Cache it and a deploy would leave browsers loading
    # asset URLs that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # API proxy. Same-origin from the browser's perspective, so the session
    # cookie is sent without cross-site quirks.
    location /api/ {
        proxy_pass http://server:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # STREAMING (the /ask SSE endpoint). Without these, nginx buffers the
        # response and the browser receives every token at once at the end --
        # the exact regression Phase 10 fought at the Python layer, reappearing
        # at the proxy. Buffering off + no read timeout keeps tokens flowing.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA fallback: a deep link like /kb/abc/documents is a client route, not a
    # file on disk. Serve index.html and let React Router resolve it; a real
    # missing asset still 404s via the /assets rule above.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
